[build]
  functions = "netlify/functions"

# 팀플 사전 알림: 매 시간 정각 실행 (UTC, KST = UTC+9)
[functions."schedule-notify"]
  schedule = "0 * * * *"

# 공모전/경진대회/대외활동/교육 자동 수집: 하루 2회
# 21:00 UTC = 06:00 KST(익일) / 09:00 UTC = 18:00 KST
# 주의: schedule 이 걸린 함수는 URL 직접 호출이 403 으로 막히므로
#       수동 수집용 crawl-contests 에는 schedule 을 걸지 않는다.
[functions."crawl-contests-cron"]
  schedule = "0 21,9 * * *"
